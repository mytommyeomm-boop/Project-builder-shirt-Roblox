name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      - name: Prepare web files
        run: |
          mkdir www
          cp index.html www/

      - name: Setup Capacitor
        run: |
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6
          npx cap init "Outfit Studio" com.jonnty.outfitstudio --web-dir www
          npx cap add android

      - name: Install ImageMagick
        run: sudo apt-get update -y && sudo apt-get install -y imagemagick

      - name: App icon from icon.png
        run: |
          R=android/app/src/main/res
          for t in mdpi,48,108 hdpi,72,162 xhdpi,96,216 xxhdpi,144,324 xxxhdpi,192,432; do
            IFS=, read n s f <<< "$t"
            mkdir -p $R/mipmap-$n
            convert icon.png -resize ${s}x${s} $R/mipmap-$n/ic_launcher.png
            convert icon.png -resize ${s}x${s} \( -size ${s}x${s} xc:none -fill white -draw "circle $((s/2)),$((s/2)) $((s/2)),0" \) -compose DstIn -composite $R/mipmap-$n/ic_launcher_round.png
            convert icon.png -resize $((f*66/100))x$((f*66/100)) -background none -gravity center -extent ${f}x${f} $R/mipmap-$n/ic_launcher_foreground.png
          done
          mkdir -p $R/values
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n  <color name="ic_launcher_background">#030E1F</color>\n</resources>\n' > $R/values/ic_launcher_background.xml

      - run: npx cap sync android

      - name: Build APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
